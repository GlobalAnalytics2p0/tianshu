    <path d="M219 410c116 0 204 25 283 84v290c-75-55-166-84-283-84-28 0-51-23-51-51V461c0-28 23-51 51-51Z" fill="url(#page)"/>
    <path d="M805 410c-116 0-204 25-283 84v290c75-55 166-84 283-84 28 0 51-23 51-51V461c0-28-23-51-51-51Z" fill="url(#page)"/>
    <path d="M512 493v291" stroke="#fff1be" stroke-width="18" stroke-linecap="round"/>
    <path d="M256 492c74 6 136 25 192 56M256 572c74 6 136 25 192 56M768 492c-74 6-136 25-192 56M768 572c-74 6-136 25-192 56" fill="none" stroke="#7b3f1a" stroke-width="18" stroke-linecap="round" opacity=".72"/>
