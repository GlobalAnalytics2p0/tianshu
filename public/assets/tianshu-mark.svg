    <path d="M512 258l47 112 119 10-91 78 28 118-103-62-103 62 28-118-91-78 119-10 47-112Z" fill="url(#gold)" opacity=".96"/>
    <path d="M512 294l31 73 78 7-60 51 19 78-68-41-68 41 19-78-60-51 78-7 31-73Z" fill="#171019" opacity=".85"/>
  </g>

