<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">天書小說品牌圖示</title>
  <desc id="desc">深色圓角方形中的金色天書、星芒與 AI 節點，用於網站 favicon 與 YouTube 頻道頭像。</desc>
  <defs>
    <linearGradient id="bg" x1="158" y1="90" x2="860" y2="926" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151724"/>
      <stop offset=".45" stop-color="#070912"/>
      <stop offset="1" stop-color="#020307"/>
    </linearGradient>
    <linearGradient id="gold" x1="184" y1="204" x2="772" y2="816" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4bd"/>
      <stop offset=".42" stop-color="#ffd37b"/>
      <stop offset="1" stop-color="#d88425"/>
    </linearGradient>
    <linearGradient id="page" x1="260" y1="355" x2="724" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4cf"/>
      <stop offset=".52" stop-color="#eabf69"/>
      <stop offset="1" stop-color="#8c5120"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 1 0 0 .74 0 0 1 0 .32 0 0 0 .45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 1 0 0 .26 0 0 1 0 .32 0 0 0 .55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="212" fill="#030408"/>
  <rect x="38" y="38" width="948" height="948" rx="188" fill="url(#bg)" stroke="rgba(255,211,123,.34)" stroke-width="18"/>
  <path d="M129 776C248 669 347 632 512 632s264 37 383 144" fill="none" stroke="#23283a" stroke-width="38" stroke-linecap="round"/>
  <path d="M166 284h96M758 284h96M258 148l46 46M766 148l-46 46M146 512h70M808 512h70" fill="none" stroke="#2d344b" stroke-width="18" stroke-linecap="round"/>

