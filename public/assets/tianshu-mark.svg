    <path d="M267 328v-58h86M757 328v-58h-86M267 721v58h86M757 721v58h-86" stroke="#45e4e2" stroke-width="22" opacity=".84"/>
    <path d="M353 270l40 40M671 270l-40 40M353 779l40-40M671 779l-40-40" stroke="#45e4e2" stroke-width="16" opacity=".72"/>
    <circle cx="267" cy="270" r="18" fill="#45e4e2" stroke="none"/>
    <circle cx="757" cy="270" r="18" fill="#45e4e2" stroke="none"/>
    <circle cx="267" cy="779" r="18" fill="#45e4e2" stroke="none"/>
