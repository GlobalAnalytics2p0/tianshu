<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">天書小說 YouTube 頻道橫幅</title>
  <desc id="desc">深色 AI 原創小說頻道橫幅，中心安全區含品牌圖示、頻道名稱與每日更新定位。</desc>
  <defs>
