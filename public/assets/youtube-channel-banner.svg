      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 1 0 0 .76 0 0 1 0 .34 0 0 0 .42 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

