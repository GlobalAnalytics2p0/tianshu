name: Build and deploy Tianshu Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-deploy-artifact.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_1.outputs.page_url || steps.deployment_attempt_2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Refuse stale Pages deployment
        run: test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Deploy to GitHub Pages
        id: deployment_attempt_1
        uses: actions/deploy-pages@v5
        with:
          timeout: 720000
        continue-on-error: true
      - name: Wait before retrying Pages deployment
        if: steps.deployment_attempt_1.outcome == 'failure'
        run: sleep 15
      - name: Retry Pages deployment
        id: deployment_attempt_2
        if: steps.deployment_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 720000
        continue-on-error: true
      - name: Wait before final retry
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        run: sleep 30
      - name: Final Pages deployment attempt
        id: deployment
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 720000
      - name: Fail when all Pages deployment attempts fail
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure' && steps.deployment.outcome == 'failure'
        run: exit 1
      - name: Verify live app shell
        run: node scripts/verify-live-app-shell.mjs --timeout-ms 180000 --poll-ms 5000
